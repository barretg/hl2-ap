[pytest]
testpaths = tests
addopts = -p no:cacheprovider
# Subsets: run one with `pytest -m <name>` (combine: `-m "bridge or install"`).
# Each test file is assigned to exactly one in tests/conftest.py. The full
# suite (plain `pytest`) is for before a release or a broad change.
markers =
    bridge: file bridge and protocol (apworld client/bridge.py)
    install: mod folder, gameinfo and installer (apworld mod/, tools/install_mod.py)
    harness: scenario harness Python side (tests/aptest/)
    data: map reader, campaign data generator, checkdata (tools/bsp_entities.py, map_logic.py, build_campaign_data.py, gen_checkdata.py)
    ids: id registry stability (apworld data/ids.json)
    lint: whole-repo static checks
